name: StreamLoungeTV
options:
  bundleIdPrefix: com.streamlounge
  deploymentTarget:
    tvOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: '9'
targets:
  StreamLoungeTV:
    type: application
    platform: tvOS
    sources:
    - App.swift
    - Models.swift
    - Playback.swift
    - Settings.swift
    - EPG.swift
    - GuideUI.swift
    - ViewingData.swift
    - LocalM3UServer.swift
    - MovieDetailsView.swift
    - KSPlayerBridge.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stream Lounge TV
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to playlist and streaming servers
          on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamlounge.tv
        TARGETED_DEVICE_FAMILY: '3'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGNING_REQUIRED: 'NO'
    scheme:
      gatherCoverageData: false
    dependencies:
    - package: KSPlayer
      product: KSPlayer
    - package: KSPlayer
      product: KSPlayerUI
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 5.6.2
