name: Build tvOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.swift'
      - 'project.yml'
      - '.github/workflows/build-tvos.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check SDK and install XcodeGen
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk appletvos --show-sdk-version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build release for Apple TV hardware
        run: |
          set -o pipefail
          xcodebuild -project StreamLoungeTV.xcodeproj -scheme StreamLoungeTV \
            -configuration Release -sdk appletvos -destination 'generic/platform=tvOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 build 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-appletvos/StreamLoungeTV.app
          test -f "$APP/StreamLoungeTV"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -x AppleTVOS
          xcrun lipo -verify_arch arm64 "$APP/StreamLoungeTV"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry StreamLoungeTV-unsigned.ipa Payload
          unzip -t StreamLoungeTV-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamLoungeTV-unsigned
          path: dist/StreamLoungeTV-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
