name: StreamLoungeTV
options:
  bundleIdPrefix: com.streamlounge
  deploymentTarget:
    tvOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.3.1
    CURRENT_PROJECT_VERSION: '10'
targets:
  StreamLoungeTV:
    type: application
    platform: tvOS
    sources:
    - App.swift
    - Models.swift
    - Playback.swift
    - Settings.swift
    - EPG.swift
    - GuideUI.swift
    - ViewingData.swift
    - LocalM3UServer.swift
    - MovieDetailsView.swift
    - KSPlayerBridge.swift
    - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stream Lounge TV
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to playlist and streaming servers
          on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamlounge.tv
        TARGETED_DEVICE_FAMILY: '3'
        ASSETCATALOG_COMPILER_APPICON_NAME: 'App Icon'
        CODE_SIGNING_ALLOWED: 'NO'
        CODE_SIGNING_REQUIRED: 'NO'
    scheme:
      gatherCoverageData: false
